[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dao-chong-model"
version = "0.1.0"
description = "道冲阴阳和合系统模型（Dao-Chong Model）——核心本体 + 检索层 + MCP 接口"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
]

[project.scripts]
dao-chong = "dao_chong.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
